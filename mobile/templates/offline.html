<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>ModaWard</title>
  <style>
    :root { --bg: #f6f3ed; --ink: #161511; --ink2: #57534a; --accent: #1f3d33; --accent-ink: #f6f3ed; }
    @media (prefers-color-scheme: dark) { :root { --bg: #100f0d; --ink: #f3efe6; --ink2: #b9b4a6; --accent: #d9c9a3; --accent-ink: #15130e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; display: grid; gap: 14px; justify-items: center; }
    h1 { font-family: 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 2rem; line-height: 1.15; margin: 8px 0 0; }
    p { margin: 0; color: var(--ink2); line-height: 1.5; }
    button { margin-top: 10px; font: inherit; font-weight: 600; padding: 14px 28px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); }
    button:active { opacity: 0.85; }
    svg { width: 56px; height: 56px; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10.2V8.6a2.9 2.9 0 1 0-2.9-2.9"/><path d="M16 10.2 4.6 19.2a2.1 2.1 0 0 0 1.3 3.8h20.2a2.1 2.1 0 0 0 1.3-3.8L16 10.2Z"/></svg>
    <h1 id="t">You’re offline</h1>
    <p id="p">ModaWard needs a connection to plan your outfits. Check your signal or Wi-Fi, then try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    // the text follows the phone's language where we have it; the app itself is fully translated once it loads
    var T = {
      es: ['Sin conexión', 'ModaWard necesita conexión para planificar tus looks. Revisa tu señal o el Wi-Fi e inténtalo de nuevo.', 'Reintentar'],
      fr: ['Vous êtes hors ligne', 'ModaWard a besoin d’une connexion pour préparer vos tenues. Vérifiez votre réseau ou le Wi-Fi, puis réessayez.', 'Réessayer'],
      de: ['Keine Verbindung', 'ModaWard braucht eine Verbindung, um Ihre Outfits zu planen. Prüfen Sie Netz oder WLAN und versuchen Sie es erneut.', 'Erneut versuchen'],
      pt: ['Você está offline', 'O ModaWard precisa de conexão para planejar seus looks. Verifique o sinal ou o Wi-Fi e tente de novo.', 'Tentar de novo'],
      it: ['Sei offline', 'ModaWard ha bisogno di una connessione per pianificare i tuoi look. Controlla il segnale o il Wi-Fi e riprova.', 'Riprova'],
      tr: ['Çevrimdışısınız', 'ModaWard’ın kombinlerinizi planlaması için bağlantı gerekir. Sinyalinizi veya Wi-Fi’ı kontrol edip tekrar deneyin.', 'Tekrar dene']
    };
    var l = (navigator.language || 'en').slice(0, 2);
    if (T[l]) { document.documentElement.lang = l; document.getElementById('t').textContent = T[l][0]; document.getElementById('p').textContent = T[l][1]; document.getElementById('retry').textContent = T[l][2]; }
    document.getElementById('retry').addEventListener('click', function () { location.replace('__SERVER_URL__/'); });
    addEventListener('online', function () { location.replace('__SERVER_URL__/'); });
  </script>
</body>
</html>
