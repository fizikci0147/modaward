<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Members only · Track Weight · ModaWard</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f6f3ed" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#100f0d" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/icons/favicon.svg?v=3" type="image/svg+xml" />
  <link rel="icon" href="/icons/favicon-32.png?v=3" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/trackweight.css" />
</head>
<body class="tw tw-locked">
  <main class="main narrow tw-main">
    <section class="tw-lock">
      <img src="/icons/favicon.svg?v=3" width="44" height="44" alt="" />
      <p class="eyebrow">Track Weight</p>
      <h1 class="display h-l">{{heading}}</h1>
      <p class="tw-lock-text">{{text}}</p>
      <div class="tw-lock-actions">
        <a class="btn btn-primary btn-l" href="{{primaryHref}}">{{primaryLabel}}</a>
        <a class="btn btn-outline btn-l" href="/">Back to ModaWard</a>
      </div>
    </section>
  </main>
</body>
</html>
